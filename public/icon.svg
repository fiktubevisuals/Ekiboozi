<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A" />
      <stop offset="50%" stop-color="#1A2026" />
      <stop offset="100%" stop-color="#0E1113" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD43B" />
      <stop offset="100%" stop-color="#F2B705" />
    </linearGradient>
    <linearGradient id="teal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F2B705" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-gradient)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#333A41" stroke-width="4" stroke-opacity="0.5" />

  <!-- Ugandan Crest / Storytelling Crest Arc -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#teal-gradient)" stroke-width="12" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Center Hexagon / Shield Backdrop -->
  <circle cx="256" cy="256" r="132" fill="#14171A" stroke="#333A41" stroke-width="6" />

  <!-- Main Gold Play Story Emblem -->
  <g filter="url(#glow)">
    <path d="M216 172 C216 160, 228 152, 238 158 L348 242 C358 248, 358 264, 348 270 L238 354 C228 360, 216 352, 216 340 Z" fill="url(#gold-gradient)" />
  </g>

  <!-- Inner Sparkle -->
  <circle cx="236" cy="216" r="8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="340" cy="180" r="12" fill="url(#teal-gradient)" />
  <circle cx="172" cy="336" r="10" fill="url(#gold-gradient)" />
</svg>
